services:
  - type: web
    name: image-to-dxf-laser-cut
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeployTrigger: off
    envVars:
      - key: BASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DB_PATH
        value: /var/data/app.db
      - key: FILES_DIR
        value: /var/data/files
      - key: ALLOWED_REDIRECTS
        value: https://chatgpt.com/connector_platform_oauth_redirect,https://chatgpt.com/connector/oauth/
    disk:
      name: image-to-dxf-data
      mountPath: /var/data
      sizeGB: 1
