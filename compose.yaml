services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: image-to-dxf:oci
    restart: unless-stopped
    environment:
      BASE_URL: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DB_PATH: /data/app.db
      FILES_DIR: /data/files
      ALLOWED_REDIRECTS: ${ALLOWED_REDIRECTS:-https://chatgpt.com/connector_platform_oauth_redirect,https://chatgpt.com/connector/oauth/}
    volumes:
      - app_data:/data
    expose:
      - "8787"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in .env}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app_data:
  caddy_data:
  caddy_config:
